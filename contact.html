<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Abaya Luxe</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="container nav-container">
            <div class="hamburger">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
            <a href="index.html" class="logo">ABAYA LUXE</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" style="color: var(--color-gold);">Contact</a></li>
            </ul>
            <div class="icons">
                <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg></a>
                <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg><span class="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you.</p>
        </div>
    </div>

    <div class="container" style="padding: 2rem 0; max-width: 800px;">
        <form style="display: grid; gap: 1.5rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <input type="text" placeholder="First Name" style="padding: 1rem; border: 1px solid #ccc;">
                <input type="text" placeholder="Last Name" style="padding: 1rem; border: 1px solid #ccc;">
            </div>
            <input type="email" placeholder="Email Address" style="padding: 1rem; border: 1px solid #ccc;">
            <textarea placeholder="Your Message" rows="5"
                style="padding: 1rem; border: 1px solid #ccc; font-family: inherit;"></textarea>

            <button class="btn btn-primary" style="justify-self: start;">Send Message</button>
        </form>

        <div style="margin-top: 4rem; text-align: center; display: grid; gap: 1rem;">
            <h3>Follow Us</h3>
            <div style="display: flex; gap: 2rem; justify-content: center; font-size: 1.5rem;">
                <a href="#">Instagram</a>
                <a href="#">WhatsApp</a>
            </div>
            <p style="margin-top: 1rem;">Email: support@abayaluxe.com</p>
        </div>
    </div>

    <footer>
        <div class="container text-center" style="color: #777; font-size: 0.8rem;">
            &copy; 2026 Abaya Luxe. All Rights Reserved.
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
